name: Actualizar la guía

# Regenera datos.json y datos-mplus.json con la guía de EPG dobleM y los sube a main.
# Así la web no depende de que alguien se acuerde de ejecutar build.py en su ordenador.
# La guía se publica a las 9:00, 13:00, 17:00 y 21:00 (hora de Madrid), así que se actualiza
# dos veces al día.
on:
  schedule:
    # La guía se publica a las 9:00, 13:00, 17:00 y 21:00 de Madrid; se pasan diez minutos
    # después de cada una. En UTC son las 8, 12, 16 y 20 en invierno (una más en verano).
    - cron: "10 8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar los dos archivos de datos
        run: python3 build.py --descargar datos.json

      - name: Comprobar que los datos son válidos
        run: |
          python3 - <<'PY'
          import json
          a = json.load(open("datos.json", encoding="utf-8"))
          b = json.load(open("datos-mplus.json", encoding="utf-8"))
          assert a["eventos"], "la agenda se ha quedado sin eventos"
          assert a["tve"] and a["tve"][0]["p"], "la parrilla de la TDT está vacía"
          assert b["mplus"], "la parrilla de Movistar Plus+ está vacía"
          dias = {p["s"][:10] for c in b["mplus"] for p in c["p"]}
          print(len(a["eventos"]), "eventos;", len(a["tve"]), "canales TDT;",
                len(b["mplus"]), "canales de Movistar Plus+;", len(dias), "días")
          PY

      - name: ¿Ha cambiado la guía?
        id: cambios
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          # El campo "generado" cambia en cada ejecución: se ignora para no subir commits vacíos.
          def leer(d):
              d = dict(d); d.pop("generado", None); return d
          def nuevo(p):
              return leer(json.load(open(p, encoding="utf-8")))
          def anterior(p):
              try:
                  return leer(json.loads(subprocess.check_output(["git", "show", "HEAD:" + p]).decode("utf-8")))
              except Exception:
                  return None
          hay = any(nuevo(p) != anterior(p) for p in ("datos.json", "datos-mplus.json"))
          print("hay=" + ("si" if hay else "no"))
          PY

      - name: Commit y push
        if: steps.cambios.outputs.hay == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json datos-mplus.json
          git commit -m "Datos actualizados $(date -u +%F)"
          git push
